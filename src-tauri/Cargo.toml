[package]
name = "meme-helper-tauri"
version = "2.4.9"
description = "Offline meme template editor and generator"
authors = ["Meme Helper"]
edition = "2021"

[[bin]]
name = "MemeHelper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
# Tauri's resource builder only uses this crate to locate Visual Studio.
# Our build script supplies the Windows SDK paths directly, so avoid its C++ probe.
vswhom-sys = { path = "../build-support/vswhom-sys" }
